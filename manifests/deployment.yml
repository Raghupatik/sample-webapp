apiVersion: v1
kind: Deployment
metadata:
  name: "test-deployment"
  namespace: default 
  labels:
    app: "test"
spec:
  containers:
  - name: MYAPP
    image: "tesde.zurecr.io/testdemo:0.0.1"
    resources:
      limits:
        cpu: 200m
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 200Mi
    env:
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: MYAPP
          key: DB_HOST
    ports:
    - containerPort:  80
      name:  http
    volumeMounts:
    - name: localtime
      mountPath: /etc/localtime
  volumes:
    - name: localtime
      hostPath:
        path: /usr/share/zoneinfo/Asia/Shanghai
  restartPolicy: Always